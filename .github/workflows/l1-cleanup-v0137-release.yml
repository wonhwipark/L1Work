name: l1-cleanup v0.13.7 one-shot release
on:
  push:
    paths:
      - '.github/workflows/l1-cleanup-v0137-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build and test isolated candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          payload = ''
          data = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(data).hexdigest() == '262b283bcbbb26bd35559d5870078128d644f4d472e3259e7f75dd1f71c3c38c'
          Path('/tmp/l1_cleanup_release_v0137.py').write_bytes(data)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/l1_cleanup_release_v0137.py')
          original=p.read_text(encoding='utf-8')
          needle='for entry in root.iterdir():'
          assert original.count(needle) == 1
          updated=original.replace(needle, 'for entry in sorted(root.iterdir(), key=lambda item: item.name != str(os.getpid())):')
          p.write_text(updated, encoding='utf-8')
          PY
          python3 /tmp/l1_cleanup_release_v0137.py
          sha256sum l1-cleanup_v0_13_7_1120.zip
      - name: Commit published ZIP
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add l1-cleanup_v0_13_7_1120.zip
          git diff --cached --quiet && exit 0
          git commit -m 'release: l1-cleanup v0.13.7 guarded hygiene improvements'
          git push origin HEAD:main
