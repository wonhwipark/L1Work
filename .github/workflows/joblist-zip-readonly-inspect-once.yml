name: Job-list runtime interface inspection (one-shot)
on:
  push:
    paths:
      - .github/workflows/joblist-zip-readonly-inspect-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout baseline ZIP
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            job-list_v0_4_34_1109.zip
          sparse-checkout-cone-mode: false
      - name: Print bounded native Profile and OpenCode invoker contracts
        shell: python
        run: |
          from pathlib import Path
          import zipfile, ast, re
          p=Path('job-list_v0_4_34_1109.zip')
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            ns=z.namelist(); prefix=ns[0].split('/')[0]+'/'
            selected=[
              'scripts/u3_opencode_linux_job.py',
              'scripts/l1_mcp_e2e_pilot_linux_job.py',
              'scripts/l1_knowledge_input_verify_linux_job.py',
              'scripts/job_core.py',
              'requests/one-shot-jobs.json',
              'lifecycle.json',
              'skillsilent/contract.json',
              'skillsilent/manifest.json',
              'skillsilent/policy.json',
              'VERSION',
              'PACKAGE_CONTENTS.sha256',
            ]
            for rel in selected:
              n=prefix+rel
              if n not in ns:
                print('MISSING',rel,flush=True);continue
              raw=z.read(n)
              if rel=='PACKAGE_CONTENTS.sha256':
                print('SHA_MANIFEST_SAMPLE',raw.decode('utf-8')[:1200],flush=True);continue
              s=raw.decode('utf-8')
              if rel=='scripts/job_core.py':
                tree=ast.parse(s)
                print('PROFILE_SECTION',s[s.index('BUILTIN_SAFE_PROFILES:'):s.index('BUILTIN_SAFE_PROFILES:')+24000])
                for node in ast.walk(tree):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                    if any(k in node.name for k in ('activat','profile','validat','dispatch','consume','enqueue','worker','result','receipt','queue','preflight')):
                      print('FUNCTION',node.name,'LINES',node.lineno,node.end_lineno)
                print('CLI_END',s[-16000:])
              else:
                print('===== SOURCE',rel,'BYTES',len(raw),'=====')
                print(s[:32000])
                print('===== END',rel,'=====')
          print('NRTx_CONTRACT_INSPECT_PASS')
